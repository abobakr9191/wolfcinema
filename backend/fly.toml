# fly.toml app configuration file generated for backend-bitter-sunbeam-7292 on 2026-10-08T22:41:59+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-bitter-sunbeam-7292'
primary_region = 'lhr'

[build]

[http_service]
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# ===== القرص الدائم =====
[[mounts]]
  source = "wolfcinema_data"
  destination = "/data"

# ===== متغيرات البيئة =====
[env]
  DATA_DIR = "/data"
  NODE_ENV = "production"